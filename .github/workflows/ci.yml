name: CI

# 说明：本项目的测试套件是"可直接执行的脚本"（退出码即结论），因此 CI 就是逐个跑套件。
# 知识库套件需本地 Ollama，离线会自动跳过并返回 0；端到端实测需 YINDUN_E2E=1，CI 不开启。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 全量回归（Python ${{ matrix.python-version }} · ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 全量测试套件（逐个执行，任一非 0 即失败）
        shell: bash
        run: |
          set -e
          fail=0
          for f in tests/*.py; do
            echo "── $f ──"
            python "$f" || { echo "❌ $f 失败"; fail=1; }
          done
          exit $fail

      - name: 构件清单（评测结果与留出集日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            tests/privacy_eval_results.json
            tests/privacy_holdout_results.json
          if-no-files-found: warn
